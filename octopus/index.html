<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Glass Octopus — 印刷小品</title>
<style>
  :root {
    --bg: #0a0d13;
    --panel: #12161e;
    --ink: #e6eef3;
    --dim: #71858f;
    --line: #1e2731;
    --accent: #5ec0d0;
  }
  * { box-sizing: border-box; }
  html, body { min-height: 100%; margin: 0; }
  body {
    background: radial-gradient(120% 70% at 50% 0%, #101720 0%, var(--bg) 60%);
    color: var(--ink);
    font: 400 15px/1.62 ui-monospace, "SFMono-Regular", "Cascadia Code", Menlo, monospace;
    -webkit-font-smoothing: antialiased;
    padding: 40px 22px 56px;
  }
  main { max-width: 1060px; margin: 0 auto; }

  header { margin-bottom: 30px; }
  h1 { margin: 0; font-size: 21px; font-weight: 500; letter-spacing: 0.01em; }
  h1 em { color: var(--accent); font-style: normal; }
  p.sub { margin: 7px 0 0; color: var(--dim); font-size: 12.5px; max-width: 64ch; }
  h2 {
    font-size: 12px;
    font-weight: 400;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--dim);
    margin: 40px 0 16px;
    padding-bottom: 9px;
    border-bottom: 1px solid var(--line);
  }

  /* The printed pieces: the gallery is the point of the page. */
  .gallery {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 22px;
  }
  figure {
    margin: 0;
    border: 1px solid var(--line);
    border-radius: 12px;
    overflow: hidden;
    background: var(--panel);
    transition: border-color 0.18s, transform 0.18s;
  }
  figure:hover { border-color: #2c3d4b; transform: translateY(-2px); }
  figure img { display: block; width: 100%; height: auto; cursor: zoom-in; }
  figcaption {
    padding: 10px 12px 12px;
    font-size: 12px;
    color: var(--dim);
    display: flex;
    gap: 8px;
    align-items: baseline;
  }
  figcaption b { color: var(--ink); font-weight: 500; }
  figcaption span { font-size: 11.5px; }

  /* The animated styles, kept below and kept small: they are a footnote to the
     prints, not the subject. */
  .player { display: flex; flex-wrap: wrap; gap: 22px; align-items: flex-start; }
  .player canvas {
    display: block;
    width: 240px;
    height: 240px;
    border: 1px solid var(--line);
    border-radius: 11px;
    background: #04090f;
  }
  .styles { display: flex; flex-wrap: wrap; gap: 7px; flex: 1 1 300px; min-width: 260px; }
  .styles button {
    appearance: none;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--panel);
    color: var(--dim);
    font: inherit;
    font-size: 12px;
    padding: 6px 10px;
    cursor: pointer;
    transition: border-color 0.15s, color 0.15s;
  }
  .styles button:hover { color: var(--ink); border-color: #2c3d4b; }
  .styles button[aria-pressed="true"] { color: var(--ink); border-color: var(--accent); }
  .note { color: var(--dim); font-size: 11.5px; margin-top: 14px; }
  .note b { color: var(--accent); font-weight: 500; }

  /* Click a print to see it full size. */
  .zoom {
    position: fixed;
    inset: 0;
    z-index: 50;
    display: none;
    place-items: center;
    background: rgba(4, 6, 10, 0.88);
    padding: 28px;
    cursor: zoom-out;
  }
  .zoom.open { display: grid; }
  .zoom img {
    max-width: min(720px, 92vw);
    max-height: 88vh;
    border-radius: 14px;
    box-shadow: 0 20px 70px rgba(0, 0, 0, 0.6);
  }
</style>
</head>
<body>
<main>
  <header>
    <h1>Glass <em>Octopus</em> — 印刷小品</h1>
    <p class="sub">
      同一套骨架，六种印刷方式。触手圆一点、眼睛大一点，身边飘点东西 ——
      网点、色版、网线都是真的在算覆盖率，不是加了一层纹理。
    </p>
  </header>

  <h2>六张印刷稿</h2>
  <div class="gallery" id="gallery"></div>

  <h2>会动的九种画法</h2>
  <div class="player">
    <canvas id="c" width="384" height="384"></canvas>
    <div>
      <div class="styles" id="styles" role="group" aria-label="画法"></div>
      <p class="note" id="meta">加载中…</p>
    </div>
  </div>
</main>

<div class="zoom" id="zoom"><img alt=""></div>

<script>
(function () {
  'use strict';

  // Frame metadata is inlined by tools/make-octopus.py, and the print list by
  // tools/cute-prints.py, so the page also works straight off disk.
  var META = /*META:BEGIN*/ {"name": "Glass Octopus", "frameWidth": 384, "frameHeight": 384, "frames": 12, "fps": 12, "columns": 12, "rows": 1, "loopMs": 1000, "styles": ["flat", "lowpoly", "pixel", "pixelneon", "sketch", "halftone", "clay", "glass", "mesh"]} /*META:END*/;
  var PRINTS = /*PRINTS:BEGIN*/ [{"id": "hearts", "label": "爱心", "note": "经典双色网屏"}, {"id": "stars", "label": "星星", "note": "四色印刷，玫瑰斑"}, {"id": "bubbles", "label": "泡泡", "note": "随机网点，无网格"}, {"id": "mixed", "label": "综合", "note": "粗网新闻纸，故意错版"}, {"id": "engraved", "label": "雕刻", "note": "交叉线屏，单色"}, {"id": "receipt", "label": "小票", "note": "针式打印，带齿孔"}] /*PRINTS:END*/;

  // ---------------------------------------------------------- print gallery
  var gallery = document.getElementById('gallery');
  var zoom = document.getElementById('zoom');
  var zoomImg = zoom.querySelector('img');

  PRINTS.forEach(function (piece) {
    var fig = document.createElement('figure');
    var img = document.createElement('img');
    img.src = 'assets/cute-' + piece.id + '.png';
    img.alt = piece.label + '：' + piece.note;
    img.loading = 'lazy';
    img.addEventListener('click', function () {
      zoomImg.src = img.src;
      zoomImg.alt = img.alt;
      zoom.classList.add('open');
    });
    var cap = document.createElement('figcaption');
    var name = document.createElement('b');
    name.textContent = piece.label;
    var note = document.createElement('span');
    note.textContent = piece.note;
    cap.appendChild(name);
    cap.appendChild(note);
    fig.appendChild(img);
    fig.appendChild(cap);
    gallery.appendChild(fig);
  });

  zoom.addEventListener('click', function () { zoom.classList.remove('open'); });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') zoom.classList.remove('open');
  });

  // --------------------------------------------------------- animated styles
  var STYLES = [
    { id: 'flat',      label: '扁色块' },
    { id: 'lowpoly',   label: '低多边形' },
    { id: 'pixel',     label: '像素画' },
    { id: 'pixelneon', label: '多巴胺像素' },
    { id: 'sketch',    label: '铅笔' },
    { id: 'halftone',  label: '网点印刷' },
    { id: 'clay',      label: '黏土' },
    { id: 'glass',     label: '玻璃' },
    { id: 'mesh',      label: '线框' }
  ];

  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var metaEl = document.getElementById('meta');
  var styleEl = document.getElementById('styles');

  var w = META.frameWidth, h = META.frameHeight;
  var frame = 0, acc = 0, last = performance.now(), current = null;
  var images = {};

  function load(id) {
    if (images[id]) return Promise.resolve(images[id]);
    return new Promise(function (resolve) {
      var img = new Image();
      img.addEventListener('load', function () { images[id] = img; resolve(img); }, { once: true });
      img.addEventListener('error', function () { resolve(null); }, { once: true });
      img.src = 'assets/octopus-' + id + '.png';
    });
  }

  function draw() {
    var img = current ? images[current] : null;
    var size = canvas.width;
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, size, size);
    if (!img) return;
    // Nearest-neighbour for the pixel styles: a smooth upscale would blur away
    // the one thing they are made of.
    ctx.imageSmoothingEnabled = current !== 'pixel' && current !== 'pixelneon';
    ctx.drawImage(img, frame * w, 0, w, h, 0, 0, size, size);
  }

  function tick(now) {
    var dt = now - last;
    last = now;
    // Guard against a huge dt after a background tab wakes up.
    acc += Math.min(dt, 250);
    var step = 1000 / META.fps;
    while (acc >= step) {
      acc -= step;
      frame = (frame + 1) % META.frames;
    }
    draw();
    requestAnimationFrame(tick);
  }

  function select(id) {
    current = id;
    [].forEach.call(styleEl.querySelectorAll('button'), function (b) {
      b.setAttribute('aria-pressed', String(b.dataset.s === id));
    });
    load(id).then(function () {
      draw();
      var label = (STYLES.filter(function (s) { return s.id === id; })[0] || {}).label;
      metaEl.innerHTML = '<b>' + label + '</b> · ' + META.frames + ' 帧 @ ' + META.fps +
        'fps · 上面六张是静帧印刷稿';
    });
  }

  STYLES.forEach(function (s) {
    var b = document.createElement('button');
    b.type = 'button';
    b.dataset.s = s.id;
    b.setAttribute('aria-pressed', 'false');
    b.textContent = s.label;
    b.addEventListener('click', function () { select(s.id); });
    styleEl.appendChild(b);
  });

  select('halftone');
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
