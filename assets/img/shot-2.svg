<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="Segoe UI, sans-serif">
  <rect width="800" height="500" fill="#18181b"/>
  <!-- 思考索引面板 -->
  <rect x="40" y="40" width="720" height="420" rx="12" fill="#09090b" stroke="#3f3f46"/>
  <rect x="40" y="40" width="720" height="36" rx="12" fill="#27272a"/>
  <circle cx="66" cy="58" r="6" fill="#ef4444"/><circle cx="86" cy="58" r="6" fill="#eab308"/><circle cx="106" cy="58" r="6" fill="#22c55e"/>
  <rect x="130" y="50" width="260" height="16" rx="8" fill="#3f3f46"/>
  <text x="80" y="120" fill="#e4e4e7" font-size="22" font-weight="700">思考过程索引</text>
  <text x="640" y="120" fill="#52525b" font-size="14" font-family="Consolas, monospace">3 steps</text>
  <!-- 步骤 1 -->
  <rect x="80" y="150" width="640" height="80" rx="10" fill="#1c1c1f" stroke="#3f3f46"/>
  <circle cx="110" cy="190" r="10" fill="#22c55e"/>
  <text x="106" y="195" fill="#09090b" font-size="13" font-weight="700">✓</text>
  <text x="136" y="183" fill="#e4e4e7" font-size="16">提出假设：布局模型把覆盖当成了叠加</text>
  <text x="136" y="210" fill="#71717a" font-size="13" font-family="Consolas, monospace">confidence 0.72 → 实测验证</text>
  <!-- 步骤 2 -->
  <rect x="80" y="250" width="640" height="80" rx="10" fill="#1c1c1f" stroke="#3f3f46"/>
  <circle cx="110" cy="290" r="10" fill="#22c55e"/>
  <text x="106" y="295" fill="#09090b" font-size="13" font-weight="700">✓</text>
  <text x="136" y="283" fill="#e4e4e7" font-size="16">测量左右缘：53.0px vs 69.0px，偏差 16px</text>
  <text x="136" y="310" fill="#71717a" font-size="13" font-family="Consolas, monospace">getBoundingClientRect × 3</text>
  <!-- 步骤 3 -->
  <rect x="80" y="350" width="640" height="80" rx="10" fill="#231639" stroke="#895ee6"/>
  <circle cx="110" cy="390" r="10" fill="#895ee6"/>
  <text x="105" y="396" fill="#fff" font-size="14" font-weight="700">★</text>
  <text x="136" y="383" fill="#e9d5ff" font-size="16">结论：计算输给测量，修正为 1.5rem</text>
  <text x="136" y="410" fill="#a08fc0" font-size="13" font-family="Consolas, monospace">lesson: measure, then trust</text>
</svg>
