<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="Segoe UI, sans-serif">
  <rect width="800" height="500" fill="#18181b"/>
  <!-- 会话窗口 -->
  <rect x="40" y="40" width="720" height="420" rx="12" fill="#09090b" stroke="#3f3f46"/>
  <rect x="40" y="40" width="720" height="36" rx="12" fill="#27272a"/>
  <circle cx="66" cy="58" r="6" fill="#ef4444"/><circle cx="86" cy="58" r="6" fill="#eab308"/><circle cx="106" cy="58" r="6" fill="#22c55e"/>
  <rect x="130" y="50" width="300" height="16" rx="8" fill="#3f3f46"/>
  <!-- 用户消息 -->
  <rect x="440" y="100" width="280" height="56" rx="12" fill="#27272a"/>
  <text x="460" y="134" fill="#e4e4e7" font-size="16">欢迎页的打字机，越到后面越慢？</text>
  <!-- AI 回复 -->
  <rect x="70" y="180" width="430" height="180" rx="12" fill="#1c1c1f" stroke="#3f3f46"/>
  <circle cx="100" cy="210" r="12" fill="#895ee6"/>
  <text x="96" y="215" fill="#fff" font-size="13" font-weight="700">AI</text>
  <text x="124" y="215" fill="#a1a1aa" font-size="13">正在核对节奏配置……</text>
  <text x="94" y="252" fill="#d4d4d8" font-size="15" font-family="Consolas, monospace">.changeDelay(150)  ← 末段 2.5x 慢</text>
  <text x="94" y="282" fill="#d4d4d8" font-size="15">根因找到：我加的「戏剧性放慢」</text>
  <rect x="94" y="308" width="150" height="32" rx="8" fill="#231639"/>
  <text x="110" y="330" fill="#d9d0e9" font-size="14">已移除 · 全程匀速</text>
  <!-- 输入条 -->
  <rect x="70" y="390" width="650" height="44" rx="22" fill="#18181b" stroke="#3f3f46"/>
  <text x="94" y="417" fill="#52525b" font-size="15">表达你自己……</text>
</svg>
